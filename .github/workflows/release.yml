name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Performance certification must not silently fall back to diagnostic mode.
  # Benchmarks run locally; GitHub accepts only an independently pinned evidence bundle.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Refuse tags outside main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow origin
          fi
          python3 scripts/prepare_release.py validate-tag --tag "$GITHUB_REF_NAME" \
            --expected-commit "$(git rev-parse "${GITHUB_SHA}^{commit}")"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and audit
        run: |
          ./gradlew build dependencyAudit -PtestJdk=21 -Pversion="${GITHUB_REF_NAME#v}"
          ./gradlew correctnessGate -PtestJdk=17 -Pversion="${GITHUB_REF_NAME#v}"

      - name: Verify evidence validator negative controls
        run: |
          python3 scripts/test_quality_thresholds.py
          python3 scripts/test_performance_bundle.py
          python3 scripts/test_release_evidence.py
          python3 scripts/test_evidence_collection.py

      - name: Capture exact candidate identity
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifacts=()
          for module in core store-redis fallback config spring-boot-starter kotlin micrometer; do
            artifacts+=("quotaflow-$module/build/libs/quotaflow-$module-$version.jar")
          done
          python3 scripts/candidate_identity.py --version "$version" \
            --artifacts "${artifacts[@]}" --output build/release-candidate.json

      - name: Import pinned local verification evidence
        env:
          EVIDENCE_URL: ${{ vars.QUOTAFLOW_RELEASE_EVIDENCE_URL }}
          EVIDENCE_SHA256: ${{ vars.QUOTAFLOW_RELEASE_EVIDENCE_SHA256 }}
          MANIFEST_SHA256: ${{ vars.QUOTAFLOW_RELEASE_MANIFEST_SHA256 }}
          BASELINE_SHA256: ${{ vars.QUOTAFLOW_BASELINE_REVIEW_SHA256 }}
        run: |
          python3 scripts/import_release_bundle.py --url "$EVIDENCE_URL" \
            --sha256 "$EVIDENCE_SHA256" --output build/imported-release-evidence
          python3 scripts/verify_release_evidence.py build/imported-release-evidence \
            --sha256 "$MANIFEST_SHA256" --candidate build/release-candidate.json \
            --baseline-review-sha256 "$BASELINE_SHA256" > build/release-acceptance.json

      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            **/build/reports/**
            **/build/test-results/**
            build/release-candidate*.json
            build/release-acceptance.json

  # Publishes all modules in one Central deployment (all-or-none), signs with
  # the project's PGP key, and drafts the GitHub Release with the SBOM.
  # Required secrets (never stored in the repo):
  #   CENTRAL_PORTAL_USERNAME / CENTRAL_PORTAL_TOKEN — Central Portal account
  #   SIGNING_KEY — armored PGP private key; SIGNING_PASSWORD — its passphrase
  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require effective publishing and signing credentials
        run: python3 scripts/prepare_release.py check-credentials --scope all

      - name: Publish to Maven Central and create the GitHub Release
        if: env.CENTRAL_PORTAL_USERNAME != '' && env.SIGNING_KEY != ''
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew publishAndReleaseToMavenCentral -Pversion="${VERSION#v}"
          ./gradlew cyclonedxBom
          gh release create "$VERSION" --draft --generate-notes \
            $(find . -path "*/build/reports/cyclonedx/bom.json" | tr '\n' ' ')
