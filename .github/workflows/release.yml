name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Full verification — the same gates as CI plus the benchmark gates.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Refuse tags outside main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Release tags must point at a commit on main."
            exit 1
          }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, audit, and run benchmark gates
        run: ./gradlew build dependencyAudit :quotaflow-core:benchmarkGate :quotaflow-store-redis:benchmarkGate

  # Publishes all modules in one Central deployment (all-or-none), signs with
  # the project's PGP key, and drafts the GitHub Release with the SBOM.
  # Required secrets (never stored in the repo):
  #   CENTRAL_PORTAL_USERNAME / CENTRAL_PORTAL_TOKEN — Central Portal account
  #   SIGNING_KEY — armored PGP private key; SIGNING_PASSWORD — its passphrase
  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central and create the GitHub Release
        if: env.CENTRAL_PORTAL_USERNAME != '' && env.SIGNING_KEY != ''
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew publishAndReleaseToMavenCentral -Pversion="${VERSION#v}"
          ./gradlew cyclonedxBom
          gh release create "$VERSION" --draft --generate-notes \
            $(find . -path "*/build/reports/cyclonedx/bom.json" | tr '\n' ' ')

      - name: Notice when secrets are absent
        if: env.CENTRAL_PORTAL_USERNAME == '' || env.SIGNING_KEY == ''
        run: |
          echo "::warning::Central Portal or signing secrets are not configured;" \
            "verification ran but nothing was published. Configure" \
            "CENTRAL_PORTAL_USERNAME/CENTRAL_PORTAL_TOKEN/SIGNING_KEY/SIGNING_PASSWORD" \
            "as repository secrets to enable releases."
