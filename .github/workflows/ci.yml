name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 21, 25]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.jdk }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify build negative controls
        run: |
          python3 scripts/test_build_verification.py
          python3 scripts/test_performance_bundle.py
          python3 scripts/test_release_evidence.py
          python3 scripts/test_evidence_collection.py

      - name: Build, test, and audit dependencies
        run: ./gradlew build dependencyAudit -PtestJdk=${{ matrix.jdk }}

      - name: Retain test and worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdk-${{ matrix.jdk }}-verification
          path: |
            **/build/reports/runtime/**
            **/build/test-results/**
            **/build/reports/jacoco/**
            **/build/reports/virtual-threads/**
            **/build/reports/generated/**

  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify threshold negative controls
        run: python3 scripts/test_quality_thresholds.py
      - name: Run independent mutation gates
        run: ./gradlew correctnessGate -PtestJdk=17
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correctness-mutations
          path: '**/build/reports/pitest/**'

  # Compiles the minimal limiter workload (local decisions + Lua-backed chain
  # evaluation) to a native image and runs it against a real Redis, proving
  # the GraalVM reachability metadata is complete. Required like the matrix.
  native-smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run the native smoke workload
        run: ./gradlew :quotaflow-native-smoke:nativeRun
        env:
          REDIS_URL: redis://localhost:6379

  native-spring:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [servlet, reactive]
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Stage candidate locally
        run: ./gradlew publishAllPublicationsToVerificationRepository -PverificationRepository=build/consumer-repository
      - name: Compile and execute native Spring assertions
        run: |
          python3 scripts/run_native_verification.py --graal-home "$JAVA_HOME" \
            --repository build/consumer-repository --redis-url redis://localhost:6379 \
            --fixtures ${{ matrix.stack }} --output build/reports/native-spring
      - name: Retain native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-spring-${{ matrix.stack }}
          path: |
            build/reports/native-spring/**
            verification/native/build/native/**
