name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # Soak profile (not a per-PR gate): 1 h of sustained mixed traffic with
  # periodic Redis pause/unpause degradation injection, continuous invariant
  # assertions, and environment-specific latency reports.
  soak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the 1 h soak profile
        run: ./gradlew :quotaflow-tck:soakTest -PsoakDurationSeconds=3600 -PtestJdk=21

      - name: Retain soak diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-hour-soak
          path: |
            **/build/reports/soak/**
            **/build/reports/runtime/**
