[versions]
slf4j = "2.0.17"
lettuce = "7.7.0.RELEASE"
netty-legacy = "4.1.135.Final"
spring-boot = "3.5.16"
kotlin = "2.2.21"
kotlinx-coroutines = "1.10.2"
junit = "5.11.4"
testcontainers = "1.21.4"
pitest-junit5 = "1.2.1"
micrometer = "1.15.5"
micrometer-tracing = "1.5.5"
jackson = "2.19.2"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
# The netty 4.1 native-transport line (reactor-netty's): combined with the
# netty 4.2 core Lettuce brings, it reproduces the incomplete-epoll classpath
# mix the store client creation must tolerate.
netty-transport-native-epoll-legacy = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty-legacy" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-jdk8 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-tracing = { module = "io.micrometer:micrometer-tracing", version.ref = "micrometer-tracing" }
micrometer-tracing-test = { module = "io.micrometer:micrometer-tracing-test", version.ref = "micrometer-tracing" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
jmh = { id = "me.champeau.jmh", version = "0.7.3" }
graalvm-native = { id = "org.graalvm.buildtools.native", version = "1.1.14" }
pitest = { id = "info.solidsoft.pitest", version = "1.19.0" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
cyclonedx-bom = { id = "org.cyclonedx.bom", version = "3.4.1" }
